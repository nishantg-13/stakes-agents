# Effect registry: tau2 airline domain (tau2-bench @ 033bf082)
#
# Reversibility is *policy-compliant and agent-relative*: an action is REVERSIBLE only if the
# agent's own tools can restore the prior state while following the domain policy
# (data/tau2/domains/airline/policy.md). See docs/decisions.md A-002.
#
# Tools not listed here fall back to tau2's own ToolType: READ -> READ. Any unlisted
# non-READ tool is an error (tests/test_registry.py enforces full coverage).
domain: airline
tools:
  book_reservation:
    type: COMPENSABLE
    why: >-
      cancel_reservation exists, but the policy allows cancellation only in narrow cases (24h,
      airline-cancelled, insured reasons), and seat release is unimplemented. A wrong booking
      can usually only be offset, not cleanly undone.
  cancel_reservation:
    type: IRREVERSIBLE
    why: No tool restores a cancelled reservation; rebooking creates a new reservation at current prices.
  send_certificate:
    type: IRREVERSIBLE
    why: No tool revokes a certificate; the policy warns "Be careful!".
  update_reservation_baggages:
    type: IRREVERSIBLE
    why: >-
      The policy lets users add but not remove checked bags, and charges are non-refundable,
      so an over-count cannot be undone under the policy.
  update_reservation_flights:
    type: COMPENSABLE
    why: >-
      Flights can be changed again (not for basic economy), but price differences, fares and
      seat availability can change in the meantime.
  update_reservation_passengers:
    type: REVERSIBLE
    why: A second call with the original passenger details restores the state at no cost (the passenger count is fixed).
  transfer_to_human_agents:
    type: IRREVERSIBLE
    canon_ignore: [summary]  # free text; differs on every sample
    why: Terminal action; it ends autonomous handling of the conversation.
  calculate:
    type: READ
    why: Pure computation, no state change.
